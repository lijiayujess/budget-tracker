<!DOCTYPE html>
<html lang="zh-CN" class="antialiased">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>记账本 - 登录</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-gray-900 dark:text-gray-100 min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-md bg-white dark:bg-gray-800 rounded-2xl shadow-xl p-8">
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-full bg-blue-100 dark:bg-blue-900 text-3xl mb-4">💰</div>
      <h1 class="text-2xl font-bold text-gray-900 dark:text-white">欢迎回来</h1>
      <p class="text-gray-500 dark:text-gray-400 mt-2">登录你的记账本账号</p>
    </div>
    <form class="space-y-5">
      <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">邮箱</label>
        <input type="email" value="name@example.com" class="w-full px-4 py-3 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500 outline-none" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">密码</label>
        <input type="password" value="password" class="w-full px-4 py-3 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500 outline-none" />
      </div>
      <button type="button" class="w-full py-3 px-4 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg transition">登录</button>
    </form>
    <div class="mt-6 flex items-center justify-between text-sm">
      <a href="#" class="text-blue-600 hover:text-blue-700 dark:text-blue-400">注册账号</a>
      <a href="#" class="text-gray-500 hover:text-gray-700 dark:text-gray-400">忘记密码？</a>
    </div>
  </div>
</body>
</html>
